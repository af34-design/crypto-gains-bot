# Example reverse-proxy configuration for Nginx.
# Place this in /etc/nginx/conf.d/crypto-gains.conf and reload nginx.
# Ensure TLS is terminated here or upstream certificates are configured.

server {
    listen 80;
    server_name crypto-gains.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crypto-gains.example.com;

    ssl_certificate     /etc/letsencrypt/live/crypto-gains.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crypto-gains.example.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
